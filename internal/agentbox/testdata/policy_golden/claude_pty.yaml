version: 1
filesystem_policy:
    include_workdir: true
    read_only:
        - /usr
        - /lib
        - /lib64
        - /bin
        - /sbin
        - /proc
        - /dev/urandom
        - /dev/random
        - /etc
        - /app
        - /var/log
    read_write:
        - /tmp
        - /home/sandbox
        - /run
        - /dev/null
        - /dev/zero
        - /workdir
        - /dev/pts
        - /dev/tty
landlock:
    compatibility: best_effort
process:
    run_as_user: sandbox
    run_as_group: sandbox
network_policies:
    anthropic:
        name: anthropic
        endpoints:
            - host: api.anthropic.com
              ports:
                - 443
            - host: '*.anthropic.com'
              ports:
                - 443
            - host: claude.com
              ports:
                - 443
            - host: '*.claude.com'
              ports:
                - 443
            - host: claude.ai
              ports:
                - 443
            - host: '*.claude.ai'
              ports:
                - 443
        binaries:
            - path: /usr/bin/node
            - path: /home/sandbox/.npm-global/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe

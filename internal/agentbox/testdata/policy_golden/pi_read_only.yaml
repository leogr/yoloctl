version: 1
filesystem_policy:
    include_workdir: false
    read_only:
        - /usr
        - /lib
        - /lib64
        - /bin
        - /sbin
        - /proc
        - /dev/urandom
        - /dev/random
        - /etc
        - /app
        - /var/log
        - /workdir
    read_write:
        - /tmp
        - /home/sandbox
        - /run
        - /dev/null
        - /dev/zero
landlock:
    compatibility: best_effort
process:
    run_as_user: sandbox
    run_as_group: sandbox
network_policies:
    pi:
        name: pi
        endpoints:
            - host: api.anthropic.com
              ports:
                - 443
            - host: platform.claude.com
              ports:
                - 443
            - host: api.openai.com
              ports:
                - 443
            - host: auth.openai.com
              ports:
                - 443
            - host: chatgpt.com
              ports:
                - 443
            - host: generativelanguage.googleapis.com
              ports:
                - 443
            - host: openrouter.ai
              ports:
                - 443
        binaries:
            - path: /usr/bin/node

version: 1
filesystem_policy:
    include_workdir: true
    read_only:
        - /usr
        - /lib
        - /lib64
        - /bin
        - /sbin
        - /proc
        - /dev/urandom
        - /dev/random
        - /etc
        - /app
        - /var/log
    read_write:
        - /tmp
        - /home/sandbox
        - /run
        - /dev/null
        - /dev/zero
        - /workdir
landlock:
    compatibility: best_effort
process:
    run_as_user: sandbox
    run_as_group: sandbox
network_policies:
    github:
        name: github
        endpoints:
            - host: github.com
              ports:
                - 443
            - host: '*.github.com'
              ports:
                - 443
            - host: '*.githubusercontent.com'
              ports:
                - 443
        binaries:
            - path: /usr/bin/git
            - path: /usr/bin/gh

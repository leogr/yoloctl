version: 1
filesystem_policy:
    include_workdir: true
    read_only:
        - /usr
        - /lib
        - /lib64
        - /bin
        - /sbin
        - /proc
        - /dev/urandom
        - /dev/random
        - /etc
        - /app
        - /var/log
    read_write:
        - /tmp
        - /home/sandbox
        - /run
        - /dev/null
        - /dev/zero
        - /workdir
landlock:
    compatibility: best_effort
process:
    run_as_user: sandbox
    run_as_group: sandbox
network_policies:
    pypi:
        name: pypi
        endpoints:
            - host: pypi.org
              ports:
                - 443
            - host: '*.pypi.org'
              ports:
                - 443
            - host: files.pythonhosted.org
              ports:
                - 443
        binaries:
            - path: /usr/bin/python3.13
            - path: /usr/bin/pip
            - path: /usr/bin/pip3
            - path: /usr/bin/python3
            - path: /usr/local/bin/uv

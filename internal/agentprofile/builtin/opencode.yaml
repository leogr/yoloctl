# OpenCode's npm distribution installs a native executable. OpenShell confines it.
name: opencode
image: yoloctl/agentbox:ubuntu-24.04
command: opencode
default_args:
  - --auto
npm_package: opencode-ai
state_container_path: /home/sandbox/.local/share/opencode
requires_features:
  - opencode
  - github
# Keep XDG config, cache and state inside this account's single native leaf.
# Nonsecret only: launch_env is visible in process argv and crosses SSH reset.
launch_env:
  XDG_DATA_HOME: /home/sandbox/.local/share
  XDG_CONFIG_HOME: "{{state_dir}}/config"
  XDG_CACHE_HOME: "{{state_dir}}/cache"
  XDG_STATE_HOME: "{{state_dir}}/state"
  NPM_CONFIG_CACHE: "{{state_dir}}/cache/npm"
  OPENCODE_DISABLE_AUTOUPDATE: "true"
  OPENCODE_DISABLE_MODELS_FETCH: "true"
  OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
  # Sharing is disabled; the bundled model catalog updates with the CLI.
  OPENCODE_CONFIG_CONTENT: '{"share":"disabled"}'
  NO_PROXY: localhost,127.0.0.1,::1
auth:
  credential_file: auth.json
  import_home_dir: .local/share/opencode
secret_injection:
  - secret: OPENCODE_API_KEY
  - secret: ANTHROPIC_API_KEY
  - secret: OPENAI_API_KEY
  - secret: GOOGLE_GENERATIVE_AI_API_KEY
  - secret: OPENROUTER_API_KEY

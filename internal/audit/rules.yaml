# Pinned yoloctl rules; see docs/digests/audit.md for limits and qualification.
# Container membership and labels describe context, never per-process confinement.
- macro: yolo_workload
  condition: (container.id != host or not container.id exists)

- macro: yolo_openshell_setup
  condition: (container.label[yoloctl.audit.schema] = "1" and container.label[yoloctl.audit.runtime_mode] = confined and container.label[yoloctl.openshell.protocol] = "2" and proc.exepath in (/opt/yoloctl/openshell-helper/yoloctl-openshell-helper, /.openshell/runtime/openshell-sandbox, /.openshell/runtime/openshell-supervisor))

# Suppress only successful network-argument reads by the fixed broker.
# Names/paths/labels narrow noise; they are not executable-authenticity proof.
- macro: yolo_openshell_netproxy_read
  condition: >-
    evt.type = process_vm_readv and evt.res = SUCCESS and
    container.label[yoloctl.audit.schema] = "1" and
    container.label[yoloctl.audit.runtime_mode] = confined and
    container.label[yoloctl.audit.network_unconfined] = "false" and
    container.label[yoloctl.openshell.protocol] = "2" and
    proc.exepath = /.openshell/runtime/openshell-sandbox and
    proc.name = openshell-netwo

- macro: yolo_fs_mutation
  condition: (evt.type in (open, openat, openat2, creat, truncate, ftruncate, rename, renameat, renameat2, unlink, unlinkat, mkdir, mkdirat, rmdir, symlink, symlinkat, link, linkat) and (evt.is_open_write = true or not evt.type in (open, openat, openat2)))

# For symlink creation, source is the new link location and target is only its
# payload. Unpacking a link to /etc/... does not modify that VM path. Rename and
# hard-link targets still refer to real objects and remain covered.
- macro: yolo_fs_target_mutation
  condition: (not evt.type in (symlink, symlinkat))

- list: yolo_infrastructure
  items: [/.openshell/runtime, /.openshell/channel, /.openshell/supervisor/config, /opt/yoloctl/bin, /run/yoloctl/controller]

- list: yolo_persistence
  items: [/etc/systemd/system, /usr/lib/systemd/system, /etc/cron.d, /etc/crontab, /etc/cron.daily, /etc/ssh, /root/.ssh, /etc/ld.so.preload]

- rule: Yolo runtime socket
  desc: Workload access to VM runtime or admin sockets; result distinguishes success and refusal
  condition: >-
    evt.type = connect and yolo_workload and fd.name in (/run/containerd/containerd.sock, /run/buildkit/buildkitd.sock, /var/run/docker.sock, /run/docker.sock, /run/yoloctl/controller/admin.sock)
  output: "Yolo runtime socket socket=%fd.name executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: WARNING
  tags: [yoloctl]

- rule: Yolo infrastructure change
  desc: Unexpected infrastructure write or namespace change; expected controller deployment/config writes are scoped by executable and host context
  condition: >-
    yolo_fs_mutation and (fs.path.name pmatch (yolo_infrastructure) or fs.path.source pmatch (yolo_infrastructure) or fs.path.name regex "^/mnt/lima-y[a-z2-7]{10}/(config|audit)(/|$)" or fs.path.source regex "^/mnt/lima-y[a-z2-7]{10}/(config|audit)(/|$)" or (yolo_fs_target_mutation and (fs.path.target pmatch (yolo_infrastructure) or fs.path.target regex "^/mnt/lima-y[a-z2-7]{10}/(config|audit)(/|$)"))) and not yolo_openshell_setup and not (container.id = host and proc.exepath = /opt/yoloctl/bin/yoloctl)
  output: "Yolo infrastructure change path=%fs.path.name source=%fs.path.source target=%fs.path.target executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: WARNING
  tags: [yoloctl]

- rule: Yolo kernel instrumentation
  desc: Workload BPF or module operations; root Falco setup is outside containers
  condition: >-
    evt.type in (bpf, init_module, finit_module, delete_module) and yolo_workload
  output: "Yolo kernel instrumentation  executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: WARNING
  tags: [yoloctl]

- rule: Yolo namespace change
  desc: Workload namespace/mount operations outside the fixed OpenShell setup executables
  condition: >-
    evt.type in (mount, umount, umount2, setns, unshare, pivot_root) and yolo_workload and not yolo_openshell_setup
  output: "Yolo namespace change  executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: WARNING
  tags: [yoloctl]

- rule: Yolo process inspection
  desc: Workload cross-process inspection outside known debugger executable paths; names are context rather than authenticity proof
  condition: >-
    evt.type in (ptrace, process_vm_readv, process_vm_writev) and yolo_workload and not (container.label[yoloctl.audit.schema] = "1" and container.label[yoloctl.audit.runtime_mode] = confined and proc.exepath in (/usr/bin/gdb, /usr/bin/lldb, /usr/bin/strace, /usr/local/bin/dlv)) and not yolo_openshell_netproxy_read
  output: "Yolo process inspection  executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: NOTICE
  tags: [yoloctl]

- rule: Yolo protected file denial
  desc: Selected sensitive file opens refused by the kernel; errno does not identify Landlock or seccomp
  condition: >-
    evt.type in (open, openat, openat2) and evt.res in (EACCES, EPERM) and fs.path.name in (/etc/shadow, /etc/gshadow, /proc/kcore, /proc/kallsyms, /dev/mem)
  output: "Yolo protected file denial path=%fs.path.name executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: NOTICE
  tags: [yoloctl]

- rule: Yolo anonymous executable
  desc: Noisy memfd or temporary-path execution detection; disabled until explicitly qualified for developer workloads
  condition: >-
    evt.type in (execve, execveat) and yolo_workload and (proc.is_exe_from_memfd = true or proc.exepath startswith /tmp/ or proc.exepath startswith /var/tmp/)
  output: "Yolo anonymous executable  executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: NOTICE
  tags: [yoloctl]
  enabled: false

- rule: Yolo persistence change
  desc: Unexpected VM/container unit cron SSH-key or loader changes; host package maintenance is normal
  condition: >-
    yolo_fs_mutation and (fs.path.name pmatch (yolo_persistence) or fs.path.source pmatch (yolo_persistence) or fs.path.name glob "/home/*/.ssh/authorized_keys" or fs.path.source glob "/home/*/.ssh/authorized_keys" or (yolo_fs_target_mutation and (fs.path.target pmatch (yolo_persistence) or fs.path.target glob "/home/*/.ssh/authorized_keys"))) and not (container.id = host and proc.exepath in (/usr/bin/apt, /usr/bin/apt-get, /usr/bin/dpkg, /usr/bin/systemctl, /opt/yoloctl/bin/yoloctl))
  output: "Yolo persistence change path=%fs.path.name source=%fs.path.source target=%fs.path.target executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: WARNING
  tags: [yoloctl]

- rule: Yolo audit test
  desc: Controlled acceptance event; no ordinary shell/git/compiler rule
  condition: >-
    evt.type in (execve, execveat) and proc.name = yolo-audit-test
  output: "Yolo audit test  executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: NOTICE
  tags: [yoloctl]

# Escape candidates: ancestry is a selector, not proof of completed confinement.
# Only UID-to-root and the selection control ship enabled. See audit-rules.md.
- macro: yolo_confined_box
  condition: (container.label[yoloctl.audit.schema] = "1" and container.label[yoloctl.audit.runtime_mode] = confined and container.label[yoloctl.openshell.protocol] = "2")

- list: yolo_openshell_runtime_paths
  items: [/.openshell/runtime/openshell-sandbox, /.openshell/runtime/openshell-supervisor]

- macro: yolo_runtime_descendant
  condition: (yolo_confined_box and proc.aexepath in (yolo_openshell_runtime_paths) and not proc.exepath in (yolo_openshell_runtime_paths) and not proc.exepath = /opt/yoloctl/openshell-helper/yoloctl-openshell-helper)

- rule: Yolo PATH directory write
  desc: Successful mutation or write-open of a direct PATH child; writable single-file binds are a known counterexample
  condition: >-
    yolo_runtime_descendant and yolo_fs_mutation and evt.res = SUCCESS and (fs.path.name regex "^(/bin|/sbin|/usr/bin|/usr/sbin|/usr/local/bin|/usr/local/sbin)/[^/]+$" or fs.path.source regex "^(/bin|/sbin|/usr/bin|/usr/sbin|/usr/local/bin|/usr/local/sbin)/[^/]+$" or (yolo_fs_target_mutation and fs.path.target regex "^(/bin|/sbin|/usr/bin|/usr/sbin|/usr/local/bin|/usr/local/sbin)/[^/]+$"))
  output: "Yolo PATH directory write path=%fs.path.name source=%fs.path.source target=%fs.path.target executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: CRITICAL
  tags: [yoloctl]
  enabled: false

- rule: Yolo unexpected confined write
  desc: Suspicious successful mutation, not an invariant because declared extra mounts may permit it
  condition: >-
    yolo_runtime_descendant and yolo_fs_mutation and evt.res = SUCCESS and (fs.path.name pmatch (/etc, /usr, /lib, /lib64, /boot, /root, /opt, /srv, /var/lib, /var/log, /app, /proc/sys, /sys, /.openshell) or fs.path.source pmatch (/etc, /usr, /lib, /lib64, /boot, /root, /opt, /srv, /var/lib, /var/log, /app, /proc/sys, /sys, /.openshell) or (yolo_fs_target_mutation and fs.path.target pmatch (/etc, /usr, /lib, /lib64, /boot, /root, /opt, /srv, /var/lib, /var/log, /app, /proc/sys, /sys, /.openshell)))
  output: "Yolo unexpected confined write path=%fs.path.name source=%fs.path.source target=%fs.path.target executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: NOTICE
  tags: [yoloctl]
  enabled: false

- rule: Yolo connect outside inner netns
  desc: Client address differs from the inner netns; tuple semantics require live qualification
  condition: >-
    yolo_runtime_descendant and evt.type = connect and evt.res in (SUCCESS, EINPROGRESS) and fd.type in (ipv4, ipv6) and container.label[yoloctl.audit.network_unconfined] = "false" and fd.cip exists and fd.cip != "10.200.0.2" and fd.rnet != "127.0.0.0/8" and fd.rip != "::1"
  output: "Yolo connect outside inner netns client=%fd.cip remote=%fd.rip port=%fd.rport executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: CRITICAL
  tags: [yoloctl]
  enabled: false

- rule: Yolo UID set to root
  desc: Successful selected UID-setting call requesting root; ancestry is not proof of confinement stage
  condition: >-
    yolo_runtime_descendant and evt.type in (setuid, setreuid, setresuid) and evt.res = SUCCESS and (evt.arg.uid = 0 or evt.arg.ruid = 0 or evt.arg.euid = 0 or evt.arg.suid = 0)
  output: "Yolo UID set to root requested_uid=%evt.arg.uid requested_ruid=%evt.arg.ruid requested_euid=%evt.arg.euid requested_suid=%evt.arg.suid parent=%proc.pexepath executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: CRITICAL
  tags: [yoloctl]

- rule: Yolo root process
  desc: Successful root exec may also be legitimate runtime setup; disabled pending evidence
  condition: >-
    yolo_runtime_descendant and evt.type in (execve, execveat) and evt.res = SUCCESS and user.uid = 0
  output: "Yolo root process parent=%proc.pexepath executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: CRITICAL
  tags: [yoloctl]
  enabled: false

- rule: Yolo container escape
  desc: Host classification plus runtime ancestry is not sufficient to distinguish escape from missing attribution
  condition: >-
    evt.type in (execve, execveat) and evt.res = SUCCESS and container.id = host and proc.aexepath in (yolo_openshell_runtime_paths)
  output: "Yolo container escape parent=%proc.pexepath executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: CRITICAL
  tags: [yoloctl]
  enabled: false

- rule: Yolo device access
  desc: Successful device open; aliases, directory opens and shared memory need a PTY baseline
  condition: >-
    yolo_runtime_descendant and evt.type in (open, openat, openat2) and evt.res = SUCCESS and fs.path.name startswith /dev/ and not fs.path.name in (/dev/null, /dev/zero, /dev/urandom, /dev/random, /dev/tty, /dev/ptmx, /dev/stdin, /dev/stdout, /dev/stderr) and not fs.path.name startswith /dev/pts/ and not fs.path.name startswith /dev/fd/
  output: "Yolo device access path=%fs.path.name executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: WARNING
  tags: [yoloctl]
  enabled: false

- rule: Yolo audit escape test
  desc: Selection-macro control only; does not qualify an escape invariant
  condition: >-
    yolo_runtime_descendant and evt.type in (execve, execveat) and proc.name = yolo-esc-test
  output: "Yolo audit escape test  executable=%proc.exepath container=%container.id result=%evt.res box=%yolo.box space=%yolo.space agent=%yolo.agent account=%yolo.account runtime=%yolo.runtime_mode network_unconfined=%yolo.network_unconfined metadata_available=%yolo.metadata_available process=%proc.name user=%user.name uid=%user.uid container_name=%container.name"
  priority: NOTICE
  tags: [yoloctl]

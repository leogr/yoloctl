name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Strict vMAJOR.MINOR.PATCH[-PRERELEASE] for QA artifacts
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - id: validate
        env:
          VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = push ]; then VERSION="$TAG_NAME"; fi
          go run -buildvcs=false ./scripts/dist.go validate "$VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  gate:
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.identity.outputs.commit }}

  dist:
    needs: [identity, gate]
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare OpenShell build toolchain
        id: native-toolchain
        run: bash scripts/ci-openshell-toolchain.sh
      - env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: make dist VERSION="$VERSION"
      - run: go run -buildvcs=false ./scripts/check-dist.go dist
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundles
          path: dist/*
          if-no-files-found: error

  macos:
    needs: [identity, dist]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.dist.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - run: go run -buildvcs=false ./scripts/check-dist.go dist
      - name: Verify final Darwin bytes and linker signature
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          mkdir arm64 amd64
          tar -xzf dist/yoloctl-darwin-arm64.tar.gz -C arm64 --strip-components 1
          tar -xzf dist/yoloctl-darwin-amd64.tar.gz -C amd64 --strip-components 1
          codesign -v arm64/yoloctl
          if codesign -v amd64/yoloctl; then echo 'amd64 signature: present'; else echo 'amd64 signature: absent (ships as linked)'; fi
          test "$(uname -m)" = arm64 # Native arm64 execution is a required gate.
          YOLOCTL_HOME="$RUNNER_TEMP/yoloctl-version" arm64/yoloctl version --json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for arch in ('arm64', 'amd64'):
              root = Path(arch)
              for name, expected in json.loads((root / 'MANIFEST.json').read_text())['files'].items():
                  assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected
          PY

  install-smoke:
    needs: [identity, gate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare OpenShell build toolchain
        id: native-toolchain
        run: bash scripts/ci-openshell-toolchain.sh
      - name: Build isolated host installation fixtures
        run: |
          make dist VERSION=v0.0.0-qa.1 BIN_DIR="$RUNNER_TEMP/qa1-bin" DIST_DIR="$RUNNER_TEMP/qa1"
          make dist VERSION=v0.0.0-qa.1 BIN_DIR="$RUNNER_TEMP/same-bin" DIST_DIR="$RUNNER_TEMP/same"
          make dist VERSION=v0.0.0-qa.2 BIN_DIR="$RUNNER_TEMP/qa2-bin" DIST_DIR="$RUNNER_TEMP/qa2"
          go run -buildvcs=false ./scripts/check-dist.go "$RUNNER_TEMP/qa1"
          go run -buildvcs=false ./scripts/check-dist.go "$RUNNER_TEMP/same"
          go run -buildvcs=false ./scripts/check-dist.go "$RUNNER_TEMP/qa2"
          case "$(uname -s)" in Darwin) osname=darwin ;; Linux) osname=linux ;; *) exit 1 ;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; *) exit 1 ;; esac
          python3 scripts/check-install-host.py \
            --first "$RUNNER_TEMP/qa1/yoloctl-$osname-$arch.tar.gz" \
            --same "$RUNNER_TEMP/same/yoloctl-$osname-$arch.tar.gz" \
            --next "$RUNNER_TEMP/qa2/yoloctl-$osname-$arch.tar.gz" \
            --output "$RUNNER_TEMP/host-install-acceptance"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [identity, gate, dist, macos, install-smoke]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.identity.outputs.version }}
      SOURCE_SHA: ${{ needs.identity.outputs.commit }}
      ARTIFACT_ID: ${{ needs.dist.outputs.artifact-id }}
      ARTIFACT_DIGEST: ${{ needs.dist.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Download exact gated artifact and reject collisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py verify --dist dist
      - run: go run -buildvcs=false ./scripts/check-dist.go dist
      - id: attest
        name: Attest final archives and checksums
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2 (peeled commit)
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Create draft only, without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py draft --dist dist
      - if: failure() && steps.attest.outcome == 'failure'
        run: echo 'Attestation failed. Check repository plan/visibility eligibility and permissions; no draft was created and provenance was not downgraded.' >&2

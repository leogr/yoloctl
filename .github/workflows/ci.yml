name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - run: make docs-check
      - run: make test-scripts
      - name: Prepare OpenShell build toolchain
        id: native-toolchain
        run: bash scripts/ci-openshell-toolchain.sh
      - name: OpenShell cache key
        id: openshell-key
        run: echo "key=$(python3 scripts/openshell-build.py key)" >> "$GITHUB_OUTPUT"
      # QA-only cache of the OpenShell build entry (bin/openshell/<key>). A hit is still checked
      # against its receipt, and make build/dist still runs the full native qualify on every
      # runner. The toolchain script pins zig and cargo-zigbuild, so it is part of the key.
      - name: Restore or save the OpenShell build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: bin/openshell/${{ steps.openshell-key.outputs.key }}
          key: openshell-${{ runner.os }}-${{ runner.arch }}-${{ steps.openshell-key.outputs.key }}-${{ hashFiles('scripts/ci-openshell-toolchain.sh') }}
      - run: make build
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 (peeled commit)
        with:
          # Pinned (not `latest`) so CI matches local `make lint` and a new
          # golangci-lint release can't silently break an unrelated push.
          # Bump deliberately, together with the locally installed binary.
          version: v2.14.0
          args: ./...

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make docs-check
      - run: make test-scripts
      - name: Prepare OpenShell build toolchain
        id: native-toolchain
        run: bash scripts/ci-openshell-toolchain.sh
      - name: OpenShell cache key
        id: openshell-key
        run: echo "key=$(python3 scripts/openshell-build.py key)" >> "$GITHUB_OUTPUT"
      # QA-only cache of the OpenShell build entry (bin/openshell/<key>). A hit is still checked
      # against its receipt, and make build/dist still runs the full native qualify on every
      # runner. The toolchain script pins zig and cargo-zigbuild, so it is part of the key.
      - name: Restore or save the OpenShell build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bin/openshell/${{ steps.openshell-key.outputs.key }}
          key: openshell-${{ runner.os }}-${{ runner.arch }}-${{ steps.openshell-key.outputs.key }}-${{ hashFiles('scripts/ci-openshell-toolchain.sh') }}
      - run: make build
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          # Pinned (not `latest`) so CI matches local `make lint` and a new
          # golangci-lint release can't silently break an unrelated push.
          # Bump deliberately, together with the locally installed binary.
          version: v2.14.0
          args: ./...
